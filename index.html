<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Emmi Lacaux</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%238B1114'/%3E%3C/svg%3E">
<style>

/* ==================================================================
   EMMI LACAUX — DIGITAL ARCHIVE (v2)

   FONTS
   -----
   Name  : "New Berolina MT"        (Monotype, calligraphic script
           by Martin Wilke, 1965) — provided font file, loaded from
           /fonts/NewBerolinaMT.ttf.
   Body  : "Generic G20-FR Classic" (demo cut, uploaded by the
           artist) — provided font file, loaded from
           /fonts/Generic-G20-FR-Classic-DEMO.otf.

   Both are loaded via @font-face pointing at the real files in
   /fonts/ (no base64 inlining needed now that this runs as a real
   project instead of a single-file artifact). The fallback keyword
   ('serif' / 'sans-serif') only applies if a browser can't load the
   font file at all.

   Note: the G20-FR Classic file is a DEMO cut. It carries full
   upper/lowercase + digits, so body text renders correctly, but a
   demo build can be missing extended punctuation/ligatures or be
   licensed for preview only — swap in the full retail file the
   same way (replace /fonts/Generic-G20-FR-Classic-DEMO.otf) once
   available.

   Verify at runtime in devtools:
     document.fonts.check("16px 'New Berolina MT'")
     document.fonts.check("16px 'Generic G20-FR Classic'")
   (both log to console on load — see bottom of <script>)
   ================================================================== */

@font-face{
  font-family:'New Berolina MT';
  src: url('fonts/NewBerolinaMT.ttf') format('truetype');
  font-display: swap;
  font-weight: 400;
}
/* FRUTIGER — commented out until licensed files are supplied.
   Once available, uncomment and replace the src with base64 data
   URIs (same method as New Berolina MT above), then update
   --font-body below to 'Frutiger' and the browser will pick it
   up automatically. Two weights: 55 Roman (400) for running text,
   65 Bold (700) only where already used (project titles, strong
   emphasis) — do not make everything bold.

@font-face{
  font-family:'Frutiger';
  src: url('data:font/woff2;base64,REPLACE_WITH_FRUTIGER_55_ROMAN') format('woff2');
  font-display: swap;
  font-weight: 400;
}
@font-face{
  font-family:'Frutiger';
  src: url('data:font/woff2;base64,REPLACE_WITH_FRUTIGER_65_BOLD') format('woff2');
  font-display: swap;
  font-weight: 700;
}
*/

@font-face{
  font-family:'Generic G20-FR Classic';
  src: url('fonts/Generic-G20-FR-Classic-DEMO.otf') format('opentype');
  font-display: swap;
  font-weight: 400;
}

:root{
  --bg:#FFFFFF;
  --ink:#111111;
  --muted:#5E5A57;
  --line:#D7D2CE;
  --red:#8B1114;

  --font-name:'New Berolina MT', serif;
  --font-body:'Generic G20-FR Classic', sans-serif;

  --gutter: clamp(18px, 4vw, 52px);
  box-sizing:border-box;
  padding-top: env(safe-area-inset-top,0px);
  padding-bottom: env(safe-area-inset-bottom,0px);
}
html{ scroll-padding-top: env(safe-area-inset-top,0px); }
*{ box-sizing:border-box; }
html,body{ margin:0; padding:0; }
/* This is a full SPA re-render per route, not a page that grows content
   above the fold gradually - scroll anchoring's "helpful" scroll-position
   correction just fights the deliberate scroll-to-top on navigation. */
html{ overflow-anchor:none; }
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-body);
  font-size:14px;
  -webkit-font-smoothing:auto;
  text-rendering:auto;
  min-height:100%;
}
img,svg{ max-width:100%; display:block; }

/* ---------------- digitized/degraded text texture (variant B2) ----------------
   blur+contrast, tuned so it reads at the site's real 14px body size.
   Scoped to body-text elements only — never applied to body/.photo/img,
   since filter on an ancestor would blur photographs too. 'Emmi Lacaux'
   (.brand / h1.brand-name, New Berolina MT) gets its own, lighter dose
   defined next to each of those rules, so it still reads as the one
   clean, legible appearance of the name. */
.photo-caption, .fragment, .label-inline, .counter, .meta,
.nextprev a, .site-footer, .project-head .title, .index-item,
.index-head, .page-simple h1:not(.brand-name), .page-simple p,
.page-simple .field-label, .page-simple .field-value,
.page-simple .contact-link, .link{
  filter: blur(.6px) contrast(200%);
}
/* Live CSS `filter: blur()` on text is unusable on phone screens — proven
   across dozens of tested magnitudes (from .0001px to 1.3px) and contrast
   values: it always renders as a hard blob, never the grain seen here on
   desktop. So on narrow viewports the live filter is off, and a script
   (bottom of page, see rasterizeMobileText) bakes the equivalent texture
   into a Canvas-2D-rendered bitmap per text element instead — manual
   pixel math (blur+contrast on the alpha channel), not the browser's own
   filter or ctx.filter (also unreliable on real Safari). Chosen after
   on-device comparison at mobile-canvas-test.html: variant "N3". */
@media (max-width:760px){
  .photo-caption, .fragment, .label-inline, .counter, .meta,
  .nextprev a, .site-footer, .project-head .title, .index-item,
  .index-head, .page-simple h1:not(.brand-name), .page-simple p,
  .page-simple .field-label, .page-simple .field-value,
  .page-simple .contact-link, .link{
    filter: none;
  }
}
a{ color:inherit; text-decoration:none; }
::selection{ background:transparent; color:var(--red); text-decoration:underline; text-decoration-color:var(--red); text-decoration-thickness:1px; transition:none !important; }

/* ---------------- cursor — the site's own — dash, twice, crossed ----------------
   Not a drawn shape: this is the literal "—" glyph from Generic G20-FR
   Classic, rendered at 20px (a touch above the 14px body size so it
   reads clearly as a cursor), weight 400, blur/contrast scaled from the
   same .6px/14px body ratio, in --red, then rotated ±45° and composited
   into one 28×28 PNG (assets/cursor-x.png). Same texture as the letters,
   not an approximation. Same everywhere, including links — the hover
   underline signals interactivity, not the cursor. */
html, body, a{
  cursor: url("assets/cursor-x.png") 14 14, auto;
}

/* ---------------- scrollbar — the same — dash, rotated vertical ----------------
   assets/scrollbar-dash.png is that same rendered, blurred dash glyph
   (in --muted instead of --red) rotated 90° and stretched the length of
   the thumb, so the scrollbar reads as the same typographic mark. */
html{ scrollbar-width:thin; scrollbar-color:var(--muted) var(--bg); }
::-webkit-scrollbar{ width:6px; height:6px; }
::-webkit-scrollbar-button{ display:none; width:0; height:0; }
::-webkit-scrollbar-track{ background:var(--bg); }
::-webkit-scrollbar-track-piece{ background:var(--bg); }
::-webkit-scrollbar-thumb{
  background-color:var(--muted);
  /* the blur on assets/scrollbar-dash.png sits at its two tips — stamped
     once at the top and once at the bottom of the thumb (flat --muted
     fills the rest) so the soft edge reads at any thumb length, instead
     of getting stretched thin across a tall thumb. */
  background-image:url("assets/scrollbar-dash.png"), url("assets/scrollbar-dash.png");
  background-repeat:no-repeat, no-repeat;
  background-position: top center, bottom center;
  background-size: 100% 18px, 100% 18px;
  border-radius:0; min-height:80px;
}
::-webkit-scrollbar-thumb:hover{ background-color:var(--ink); }
::-webkit-scrollbar-corner{ background:var(--bg); }

/* ---------------- one link language, used everywhere ---------------- */
/* No persistent "active" look — only :hover turns text red + underlined.
   Direct text-decoration, no border-bottom/padding hit-area tricks. */
.link,
.link.active{
  color:var(--ink);
  text-decoration:none;
  text-underline-offset:3px;
  text-decoration-thickness:1px;
  transition:none !important;
  animation:none !important;
}
.link:hover,
.link.active:hover{
  color:var(--red);
  text-decoration:underline;
  text-decoration-color:var(--red);
}

/* ---------------- header / nav ---------------- */
header.site{
  position:fixed; top:0; left:0; right:0; z-index:40;
  background:transparent;
  display:flex; justify-content:space-between; align-items:flex-start;
  padding: 22px var(--gutter) 16px;
  padding-top: calc(env(safe-area-inset-top,0px) + 22px);
}
header.site .brand{
  font-family:var(--font-name);
  font-style:italic;
  color:var(--red);
  font-size: 1.05rem;
  letter-spacing:.01em;
  line-height:1;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  -webkit-text-stroke:0;
  text-shadow:none;
  /* lighter dose of the digitized texture than body text, so the name
     stays the cleanest thing on the page — bumped up a touch. */
  filter: blur(.375px) contrast(145%);
}
@media (max-width:760px){
  header.site .brand{ filter: none; }
}
/* On any page but home, the name is also the way back — hovering it
   underlines, same red, same rule as every other link on the site.
   On home there's nowhere to go back to, so no underline. */
.not-home header.site .brand:hover{
  text-decoration:underline;
  text-decoration-color:var(--red);
  text-underline-offset:3px;
  text-decoration-thickness:1px;
}
header.site nav{ display:flex; gap: 22px; }
header.site nav a{ font-size:.8rem; }

@media (max-width:640px){
  header.site nav{ gap:14px; }
}

/* ---------------- app shell ---------------- */
#app{ min-height:100vh; padding-top:64px; padding-bottom:14vh; }
.field{ position:relative; width:100%; padding: 0 var(--gutter); }

.pause-xs{ height: clamp(28px, 5vh, 56px); }
.pause-s{ height: clamp(56px, 9vh, 110px); }
.pause-m{ height: clamp(100px, 16vh, 210px); }
.pause-l{ height: clamp(170px, 26vh, 340px); }
.pause-xl{ height: clamp(240px, 38vh, 480px); }

/* ---------------- photograph / placeholder ---------------- */
.photo{
  position:relative; overflow:hidden;
  background:#F1EFEC; /* flat neutral — "image will be here", not a simulated photo */
}
.photo img{ width:100%; display:block; }

.photo-caption{
  margin-top:9px; font-size:.72rem; color:var(--muted);
}

/* ---------------- image event wrapper ---------------- */
.event{ display:flex; width:100%; }
.event.left{ justify-content:flex-start; }
.event.right{ justify-content:flex-end; }
.event.center{ justify-content:center; }

/* predefined scale system */
.sc-xs   { width:min(220px, 46vw); }
.sc-s    { width:min(340px, 60vw); }
.sc-m    { width:min(500px, 78vw); }
.sc-l    { width:min(700px, 86vw); }
.sc-xl   { width:min(920px, 94vw); }
.sc-full { width:100%; }

.r-16-9{ aspect-ratio:16/9; }
.r-3-2 { aspect-ratio:3/2; }
.r-4-5 { aspect-ratio:4/5; }
.r-3-4 { aspect-ratio:3/4; }
.r-2-3 { aspect-ratio:2/3; }
.r-1-1 { aspect-ratio:1/1; }
.r-9-16{ aspect-ratio:9/16; }

@media (max-width:760px){
  .sc-l,.sc-xl{ width:100%; }
  .sc-m{ width:min(90vw, 460px); }
}

/* ---------------- text fragments / meta ---------------- */
.fragment{
  max-width: 32ch;
  font-family:var(--font-body);
  font-size:.92rem; line-height:1.75; color:var(--ink);
}
.fragment.right{ margin-left:auto; text-align:right; }

.meta{
  font-size:.78rem; color:var(--muted);
  line-height:1.9;
}
.meta strong{ color:var(--ink); font-weight:500; }

/* ---------------- discreet index counter ---------------- */
.counter{
  position:fixed; right: var(--gutter); bottom: calc(env(safe-area-inset-bottom,0px) + 18px);
  font-size:.68rem; color:var(--muted);
  z-index:30; pointer-events:none;
}

/* ---------------- project title inline label ---------------- */
.label-inline{
  font-size:.78rem; color:var(--muted);
}

/* ---------------- footer nav row ---------------- */
.nextprev{
  display:flex; justify-content:space-between; align-items:baseline;
  padding: 0 var(--gutter);
  margin: 14vh var(--gutter) 0;
}
.nextprev a{ font-size:.78rem; }

.archive-link{ font-size:.78rem; }

/* ---------------- site footer ---------------- */
.site-footer{
  display:flex; justify-content:space-between; align-items:baseline;
  padding: 16px var(--gutter);
  margin-top: 10vh;
  border-top:1px solid var(--line);
}
.site-footer span{ font-size:.72rem; color:var(--muted); }
.site-footer a{ font-size:.72rem; }
/* on pages too short to scroll (About/Contact), "Go to top" stays —
   it's part of the footer's own rhythm — but struck through, so it
   reads as on-purpose rather than a broken link. Clicking it anyway
   reveals a small aside instead of doing nothing silently. */
.footer-left{ display:inline-flex; align-items:baseline; gap:8px; }
.site-footer a.no-top{ text-decoration:line-through; text-decoration-color:var(--muted); }
.no-top-msg{ font-size:.72rem; color:var(--muted); }

/* ---------------- work index ---------------- */
.index-list{ padding: 0 var(--gutter); }
.index-item{
  display:grid; grid-template-columns: 28px 90px 100px 1fr; gap:18px; align-items:baseline;
  padding: 16px 0; border-top:1px solid var(--line);
}
.index-list .index-item:last-child{ border-bottom:1px solid var(--line); }
.index-item .no{ font-size:.72rem; color:var(--muted); font-variant-numeric:tabular-nums; }
.index-item .cat{ font-size:.72rem; color:var(--muted); }
.index-item .yr{ font-size:.72rem; color:var(--muted); }
.index-item .ti{ font-family:var(--font-body); font-size:.92rem; }
.index-head{
  padding: 0 var(--gutter); margin-bottom:8px;
  font-size:.78rem; color:var(--muted);
}
@media (max-width:560px){
  .index-item{ grid-template-columns: 20px 70px 80px 1fr; gap:10px; }
}

/* ---------------- simple page (about / contact) ---------------- */
.page-simple{ max-width:520px; padding: 6vh var(--gutter) 0; }
.page-simple h1{
  font-family:var(--font-body); color:var(--ink);
  font-size:.92rem; font-weight:400; margin:0 0 8vh;
}
/* the name treatment (New Berolina MT, red) belongs to 'Emmi Lacaux'
   only — never reused for a plain heading like 'Contact'. */
.page-simple h1.brand-name{
  font-family:var(--font-name); font-style:italic; color:var(--red);
  font-size:1.5rem; font-weight:400;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  -webkit-text-stroke:0;
  text-shadow:none;
  /* a touch of the same digitized texture as the body text, at a lower
     dose — enough to feel part of the same visual language, not enough
     to fight the name's own legibility as the one big appearance. */
  filter: blur(.3px) contrast(140%);
}
.page-simple p{ font-size:.92rem; line-height:1.85; color:var(--ink); margin:0 0 1.6em; max-width:50ch; }
.page-simple .field-label{ font-size:.72rem; color:var(--muted); margin-bottom:6px; }
.page-simple .stack{ display:flex; flex-direction:column; gap:34px; margin-top:7vh; }
.page-simple .field-value{ color:var(--ink); }
.page-simple .contact-link{ font-size:.98rem; }

/* ---------------- project head ---------------- */
.project-head{ padding: 0 var(--gutter); margin-bottom: 14vh; }
.project-head .title{
  font-size:1.15rem; letter-spacing:.02em; margin:0 0 14px; font-weight:500;
}
.project-head .meta{ display:flex; gap:16px; flex-wrap:wrap; }

/* (reveal-on-scroll system removed — content exists immediately, nothing animates in) */

a:focus-visible, button:focus-visible{ outline:1.5px solid var(--red); outline-offset:3px; }
.scroll-x{ overflow-x:auto; -webkit-overflow-scrolling:touch; }

</style>
</head>
<body>

<header class="site">
  <a class="brand" href="#/">Emmi Lacaux</a>
  <nav id="nav"></nav>
</header>

<main id="app"></main>
<div class="counter" id="counter"></div>

<script>
/* ==============================================================
   DATA
   ============================================================== */
const PROJECTS = [
  {
    slug: 'galactica-ibiza-2026',
    title: 'Galactica — Ibiza 2026',
    year: '2026',
    date: 'May – Sep 2026',
    location: 'Ibiza, Spain',
    category: 'Photography',
    medium: 'Photography',
    description: "Ibiza, June to September. Nights, faces, empty rooms, the light before it gets too hot to stay outside.",
    titlePosition: 'start', // start | inline | late
    order: 1,
    sequence: [
      { type:'image', scale:'sc-l', align:'left',   src:'photos/galactica-ibiza-2026/P1011636.JPG' },
      { type:'pause', size:'m' },
      { type:'image', scale:'sc-l', align:'right',  src:'photos/galactica-ibiza-2026/P1011533.JPG' },
      { type:'pause', size:'l' },
      { type:'text',  text:'Blurry memories from the best of this summer — love to everyone who was part of my path.', align:'right' },
      { type:'pause', size:'l' },
      { type:'image', scale:'sc-l', align:'center', src:'photos/galactica-ibiza-2026/P1011897.JPG' },
      { type:'pause', size:'s' },
      { type:'image', scale:'sc-l', align:'left',   src:'photos/galactica-ibiza-2026/P1011492.JPG' },
      { type:'pause', size:'xl' },
      { type:'image', scale:'sc-l', align:'right',  src:'photos/galactica-ibiza-2026/P1011876.JPG' },
      { type:'pause', size:'m' },
      { type:'image', scale:'sc-l', align:'center', src:'photos/galactica-ibiza-2026/P1011653.JPG' },
      { type:'pause', size:'l' },
      { type:'image', scale:'sc-l', align:'left',   src:'photos/galactica-ibiza-2026/P7151313.JPG' },
      { type:'pause', size:'s' },
      { type:'image', scale:'sc-l', align:'right',  src:'photos/galactica-ibiza-2026/P1011469.JPG' },
      { type:'pause', size:'m' },
      { type:'image', scale:'sc-l', align:'center', src:'photos/galactica-ibiza-2026/P1011883.JPG' },
      { type:'pause', size:'l' },
      { type:'image', scale:'sc-l', align:'left',   src:'photos/galactica-ibiza-2026/P1011892.JPG' },
      { type:'pause', size:'m' },
      { type:'image', scale:'sc-l', align:'right',  src:'photos/galactica-ibiza-2026/P1011904.JPG' },
      { type:'pause', size:'m' },
      { type:'image', scale:'sc-l', align:'left',   src:'photos/galactica-ibiza-2026/P1011639.JPG' },
      { type:'pause', size:'s' },
      { type:'image', scale:'sc-l', align:'center', src:'photos/galactica-ibiza-2026/P7151307.JPG' },
      { type:'pause', size:'xl' },
      { type:'image', scale:'sc-l', align:'left',   src:'photos/galactica-ibiza-2026/P7151298.JPG' },
      { type:'pause', size:'m' },
      { type:'image', scale:'sc-l', align:'right',  src:'photos/galactica-ibiza-2026/P1011901.JPG' },
      { type:'pause', size:'l' },
      { type:'image', scale:'sc-l', align:'center', src:'photos/galactica-ibiza-2026/P1011914.JPG' },
      { type:'pause', size:'s' },
      { type:'image', scale:'sc-l', align:'left',   src:'photos/galactica-ibiza-2026/P1011929.JPG' },
      { type:'pause', size:'xl' },
      { type:'text',  text:'Gente fuerte — thank you Galactica, you did something great.', align:'left' },
    ]
  }
];

function proj(slug){ return PROJECTS.find(p=>p.slug===slug); }
function orderedProjects(){ return [...PROJECTS].sort((a,b)=>(a.order||0)-(b.order||0)); }

function countImages(sequence){ return sequence.filter(s=>s.type==='image').length; }

function photoDiv({ratio='r-3-2', scale='sc-m', align='left', caption, src, alt='', credit, number}){
  // NOTE: there is no reveal/appear animation anywhere on the site —
  // the reveal-on-scroll system was removed. Every element, image or
  // text, is simply present in the DOM from the start.
  //
  // Real photography: pass `src` (and `alt`) on a sequence item. The
  // <img> renders at its own natural aspect ratio (no object-fit:cover,
  // no forced crop, no `ratio` box) — portrait stays portrait, landscape
  // stays landscape. `ratio` is only used to shape the flat neutral
  // placeholder box before a real photograph exists.
  const wrap = document.createElement('div');
  wrap.className = `event ${align}`;
  const inner = document.createElement('div');
  inner.className = `${scale}`;

  const p = document.createElement('div');
  if(src){
    p.className = 'photo';
    const img = document.createElement('img');
    img.src = src;
    img.alt = alt || '';
    img.loading = 'eager';
    p.appendChild(img);
  } else {
    p.className = `photo ${ratio}`; // neutral box only, no gradient — "image will be here"
  }
  inner.appendChild(p);

  if(caption || credit || number){
    const c = document.createElement('div');
    c.className = 'photo-caption';
    c.textContent = [number, caption, credit].filter(Boolean).join('  —  ');
    inner.appendChild(c);
  }
  wrap.appendChild(inner);
  wrap.dataset.isImage = '1';
  return wrap;
}

function textDiv(text, align='left'){
  const wrap = document.createElement('div');
  wrap.className = `event ${align==='right'?'right':'left'}`;
  const inner = document.createElement('div');
  inner.className = `fragment ${align==='right'?'right':''}`;
  inner.textContent = text;
  wrap.appendChild(inner);
  return wrap;
}

function labelDiv(text){
  const wrap = document.createElement('div');
  wrap.className = 'field';
  wrap.style.padding = '0';
  const inner = document.createElement('div');
  inner.className = 'label-inline';
  inner.textContent = text;
  wrap.appendChild(inner);
  return wrap;
}

function pauseDiv(size='m'){
  const d = document.createElement('div');
  d.className = `pause-${size}`;
  return d;
}

function renderSequence(container, sequence){
  sequence.forEach(item=>{
    if(item.type === 'image') container.appendChild(photoDiv(item));
    else if(item.type === 'text') container.appendChild(textDiv(item.text, item.align));
    else if(item.type === 'label') container.appendChild(labelDiv(item.text));
    else if(item.type === 'pause') container.appendChild(pauseDiv(item.size));
  });
}

function appendFooter(app, opts={}){
  const f = document.createElement('div');
  f.className = 'site-footer';
  f.innerHTML = `
    <span class="footer-left">
      <a class="link${opts.noTop ? ' no-top' : ''}" href="#top" data-top="1">Go to top</a>${opts.noTop ? '<span class="no-top-msg" hidden>no where to go</span>' : ''}
    </span>
    <span class="archive-date">Archive / 2026</span>
  `;
  app.appendChild(f);
  const topLink = f.querySelector('[data-top]');
  let noTopTimer;
  topLink.addEventListener('click', (e)=>{
    e.preventDefault();
    if(opts.noTop){
      const msg = f.querySelector('.no-top-msg');
      msg.hidden = false;
      if (isMobileView()) rasterizeOne(msg);
      clearTimeout(noTopTimer);
      noTopTimer = setTimeout(()=>{ msg.hidden = true; }, 2200);
    } else {
      window.scrollTo(0,0);
    }
  });
}

/* ---------------------------- pages ---------------------------- */

function renderHome(){
  const app = document.getElementById('app');
  app.innerHTML = '';
  const field = document.createElement('div');
  field.className = 'field';

  const p = PROJECTS[0];
  let total = 0;
  if(p){
    total = countImages(p.sequence);
    renderSequence(field, p.sequence);
    field.appendChild(pauseDiv('l'));

    const linkRow = document.createElement('div');

/* ---------------------------- mobile text rasterization ----------------------------
   Live CSS `filter: blur()` is unusable on phone screens (see the CSS
   comment above the mobile @media block) — always a hard blob, in every
   mobile browser, at every magnitude tried. This bakes the equivalent
   texture into a Canvas-2D bitmap per text element instead, using manual
   pixel math (not the browser's blur, not ctx.filter — also unreliable on
   real Safari): a 3-pass box blur on the alpha channel approximates a
   Gaussian (smoother falloff than one big box blur, so tight letter
   counters like the eye of an "e" don't bridge shut), then a contrast
   curve on that same alpha hardens the edge. Parameters ("N3") were
   picked by eye on a real phone at mobile-canvas-test.html. The bitmap is
   shown via a separate absolutely-positioned <img> overlaid exactly on
   top of the now-transparent-inked real text (not a background-image on
   the element itself — that forced choosing between clipping the blur's
   fade at one edge or nudging the element's own box, which has zero
   spare pixels in a tight nav/index/footer row). The overlay can bleed a
   few px past the text's box on every side with no layout effect at all,
   since it's out of flow; the real text underneath still carries the
   click targets and accessibility. Runs only on narrow (mobile)
   viewports; desktop keeps the plain live CSS filter, unaffected. */
const MOBILE_TEXT_SELECTOR = '.photo-caption, .fragment, .label-inline, .counter, ' +
  '.meta span, .site-footer .archive-date, .no-top-msg, .project-head .title, ' +
  '.index-item .no, .index-item .cat, .index-item .yr, .index-head, ' +
  '.page-simple h1:not(.brand-name), .page-simple p, .page-simple .field-label, ' +
  '.page-simple .field-value, .link, header.site .brand';

function isMobileView(){ return window.matchMedia('(max-width:760px)').matches; }

// Element -> its overlay <img>. The overlay (not a background-image on the
// element itself) is what lets the blurred bitmap bleed a couple pixels
// past the element's own box for the blur to fade into, on every side,
// without changing that element's width/height/display at all — no risk
// of nudging a tight nav/index/footer layout that has zero pixels to
// spare, which is exactly what background-image-on-the-element did.
const rasterOverlays = new Map();

function clearRasterizedText(){
  rasterOverlays.forEach(img => img.remove());
  rasterOverlays.clear();
  document.querySelectorAll(MOBILE_TEXT_SELECTOR).forEach(el=>{
    el.style.removeProperty('color');
    el.style.removeProperty('-webkit-text-fill-color');
    el.style.removeProperty('background-image');
    el.style.removeProperty('background-size');
    el.style.removeProperty('background-repeat');
    el.style.removeProperty('background-position');
    el.style.removeProperty('display');
    el.style.removeProperty('width');
    el.style.removeProperty('height');
  });
}

// Fractional-radius box blur on the alpha channel (the ink itself is a
// flat fill color; only the anti-aliased edge *coverage* varies).
function boxBlurAlpha(imageData, radius){
  if (radius <= 0) return;
  const { data, width, height } = imageData;
  const r = Math.floor(radius);
  const frac = radius - r;
  const tmp = new Float32Array(width * height);
  for (let y = 0; y < height; y++){
    for (let x = 0; x < width; x++){
      let sum = 0, weight = 0;
      for (let dx = -r; dx <= r; dx++){
        const nx = x + dx;
        if (nx >= 0 && nx < width){ sum += data[(y * width + nx) * 4 + 3]; weight += 1; }
      }
      if (frac > 0){
        const lx = x - r - 1, rx = x + r + 1;
        if (lx >= 0){ sum += data[(y * width + lx) * 4 + 3] * frac; weight += frac; }
        if (rx < width){ sum += data[(y * width + rx) * 4 + 3] * frac; weight += frac; }
      }
      tmp[y * width + x] = sum / weight;
    }
  }
  for (let x = 0; x < width; x++){
    for (let y = 0; y < height; y++){
      let sum = 0, weight = 0;
      for (let dy = -r; dy <= r; dy++){
        const ny = y + dy;
        if (ny >= 0 && ny < height){ sum += tmp[ny * width + x]; weight += 1; }
      }
      if (frac > 0){
        const ly = y - r - 1, ry = y + r + 1;
        if (ly >= 0){ sum += tmp[ly * width + x] * frac; weight += frac; }
        if (ry < height){ sum += tmp[ry * width + x] * frac; weight += frac; }
      }
      data[(y * width + x) * 4 + 3] = Math.round(sum / weight);
    }
  }
}
// 3 passes of a small box blur approximate a Gaussian — energy concentrates
// near the center and tapers off, instead of spreading dead-evenly across
// the whole radius the way one big box blur pass does.
function gaussianApproxAlpha(imageData, radiusPerPass, passes){
  for (let i = 0; i < passes; i++) boxBlurAlpha(imageData, radiusPerPass);
}
function contrastAlpha(imageData, contrastPct){
  const factor = contrastPct / 100;
  const { data } = imageData;
  for (let i = 3; i < data.length; i += 4){
    const a = (data[i] / 255 - 0.5) * factor + 0.5;
    data[i] = Math.max(0, Math.min(255, Math.round(a * 255)));
  }
}

function wrapCanvasText(ctx, text, maxWidth){
  const words = text.split(/\s+/).filter(Boolean);
  const lines = [];
  let line = '';
  words.forEach(word=>{
    const test = line ? line + ' ' + word : word;
    if (line && ctx.measureText(test).width > maxWidth) {
      lines.push(line);
      line = word;
    } else {
      line = test;
    }
  });
  if (line) lines.push(line);
  return lines;
}

function rasterizeOne(el, retry){
  const text = (el.textContent || '').trim();
  if (!text) return;
  const rect = el.getBoundingClientRect();
  const width = Math.ceil(rect.width);
  if (!width) return;

  const cs = getComputedStyle(el);
  // "Emmi Lacaux" gets a lighter dose than body text, same relationship
  // as its desktop filter (blur(.375px)/contrast(145%) vs body's
  // blur(.6px)/contrast(200%)) — the name stays the cleanest thing here too.
  const isBrand = el.matches('header.site .brand');
  // Everything in header.site (brand + nav links) is position:fixed and
  // never moves with document scroll - its overlay has to be fixed too,
  // not absolute-with-scrollY, or it drifts away the moment the page scrolls.
  const isFixed = !!el.closest('header.site');
  const radiusPerPass = 0.45;
  const contrastPct = isBrand ? 118 : 130;
  // The blur needs a little room on every side to fade out instead of
  // hitting a hard wall right at the canvas edge (which reads as a
  // pixelated/cut-off border). That room comes from the *overlay* image
  // being pad px bigger than the element on each side (see below) — never
  // from resizing the element itself, which has zero spare pixels in a
  // tight nav/index/footer row and would just clip on the opposite edge.
  const pad = 3;

  const fontSize = parseFloat(cs.fontSize) || 14;
  let lineHeight = parseFloat(cs.lineHeight);
  if (!lineHeight || isNaN(lineHeight)) lineHeight = fontSize * 1.3;
  const textAlign = cs.textAlign === 'start' ? 'left' : cs.textAlign;
  const font = `${cs.fontStyle} ${cs.fontWeight} ${fontSize}px ${cs.fontFamily}`;
  // Canvas ignores letter-spacing unless told explicitly — without this,
  // measured/drawn text is narrower than the real (letter-spaced) DOM box,
  // so wrapping disagrees with the live layout (e.g. the project title,
  // which sets letter-spacing:.02em).
  const letterSpacing = cs.letterSpacing && cs.letterSpacing !== 'normal' ? cs.letterSpacing : '0px';

  // Some elements (e.g. .index-head) carry their own horizontal padding
  // rather than relying on an ancestor's — rect.width is the border box,
  // so wrapping/drawing against it directly ignores that inset and draws
  // the text flush with the box's outer edge instead of where it actually
  // sits, clipping it against whatever's to the left (the logo, in that case).
  const paddingLeft = parseFloat(cs.paddingLeft) || 0;
  const paddingRight = parseFloat(cs.paddingRight) || 0;
  const contentWidth = Math.max(0, width - paddingLeft - paddingRight);

  const measure = document.createElement('canvas').getContext('2d');
  measure.font = font;
  try { measure.letterSpacing = letterSpacing; } catch(e){}
  const lines = wrapCanvasText(measure, text, contentWidth);
  const textHeight = Math.ceil(lines.length * lineHeight);
  if (!textHeight) return;

  const overlayW = width + pad * 2;
  const overlayH = textHeight + pad * 2;
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  const canvas = document.createElement('canvas');
  canvas.width = Math.ceil(overlayW * dpr);
  canvas.height = Math.ceil(overlayH * dpr);
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.font = font;
  try { ctx.letterSpacing = letterSpacing; } catch(e){}
  ctx.fillStyle = cs.color;
  ctx.textBaseline = 'top';
  lines.forEach((line, i)=>{
    const lineWidth = ctx.measureText(line).width;
    let x = pad + paddingLeft;
    if (textAlign === 'center') x = pad + paddingLeft + (contentWidth - lineWidth) / 2;
    else if (textAlign === 'right') x = pad + paddingLeft + contentWidth - lineWidth;
    ctx.fillText(line, x, i * lineHeight + pad);
  });

  const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  gaussianApproxAlpha(imgData, radiusPerPass * dpr, 3);
  contrastAlpha(imgData, contrastPct);
  ctx.putImageData(imgData, 0, 0);

  el.style.setProperty('color', 'transparent');
  el.style.setProperty('-webkit-text-fill-color', 'transparent');

  let img = rasterOverlays.get(el);
  if (!img) {
    img = document.createElement('img');
    img.setAttribute('aria-hidden', 'true');
    img.style.position = isFixed ? 'fixed' : 'absolute';
    img.style.pointerEvents = 'none';
    document.body.appendChild(img);
    rasterOverlays.set(el, img);
  }
  if (isFixed) {
    img.style.left = `${rect.left - pad}px`;
    img.style.top = `${rect.top - pad}px`;
  } else {
    img.style.left = `${rect.left + window.scrollX - pad}px`;
    img.style.top = `${rect.top + window.scrollY - pad}px`;
  }
  img.style.width = `${overlayW}px`;
  img.style.height = `${overlayH}px`;

  // Swap the src only once the new bitmap is fully decoded, so a real
  // device never paints a half-decoded frame of the overlay for a tick.
  const dataUrl = canvas.toDataURL('image/png');
  const pre = new Image();
  pre.src = dataUrl;
  // Both mobile Chrome and Safari can leave a freshly (re)painted overlay
  // out of the composited frame after a route change - the element is
  // correctly sized/positioned/decoded (verified), it's just never
  // actually drawn until *something* forces a repaint, which is why it
  // looked fixed by "nothing" (a later unrelated scroll/resize). Force
  // that repaint ourselves right after each swap instead of hoping one
  // happens to come along.
  const forceRepaint = () => { void img.offsetHeight; };
  if (pre.decode) {
    pre.decode().then(()=>{ img.src = dataUrl; forceRepaint(); }).catch(()=>{ img.src = dataUrl; forceRepaint(); });
  } else {
    img.src = dataUrl;
    forceRepaint();
  }

  // Real devices can still be mid-layout-shift (late webfont swap, a photo
  // above this element loading in and pushing things around) at the exact
  // moment this ran, especially right after a route change. If the box's
  // width changed since we measured it, the overlay no longer lines up —
  // measure again and redo it once, rather than leave a stale/misplaced
  // one up.
  if (!retry) {
    const rectNow = el.getBoundingClientRect();
    if (Math.abs(Math.ceil(rectNow.width) - width) > 1 || Math.abs(rectNow.top - rect.top) > 1) {
      rasterizeOne(el, true);
    }
  }
}

let rasterizeScheduled = false;
function rasterizeMobileText(){
  if (rasterizeScheduled) return;
  rasterizeScheduled = true;
  requestAnimationFrame(()=>{
    rasterizeScheduled = false;
    clearRasterizedText();
    if (!isMobileView()) return;
    document.querySelectorAll(MOBILE_TEXT_SELECTOR).forEach(el=>{
      if (el.hidden || el.offsetParent === null) return; // skip hidden (e.g. .no-top-msg before its first click)
      rasterizeOne(el);
    });
  });
}

let mobileTextResizeTimer;
let lastInnerWidth = window.innerWidth;
window.addEventListener('resize', ()=>{
  // iOS Safari fires 'resize' repeatedly while its address bar collapses
  // and expands during ordinary scrolling - including on pages with
  // nothing to scroll. A full rasterizeMobileText() tears down every
  // overlay and rebuilds them one by one as each bitmap decodes, so
  // reacting to every one of those height-only blips made text flicker
  // out and stagger back in mid-scroll. Only redo the actual rendering
  // when the width changed (rotation, real resize) - a height-only change
  // can't affect any of these elements' wrap or position.
  if (window.innerWidth === lastInnerWidth) return;
  lastInnerWidth = window.innerWidth;
  clearTimeout(mobileTextResizeTimer);
  mobileTextResizeTimer = setTimeout(rasterizeMobileText, 200);
});
document.fonts.ready.then(rasterizeMobileText);

/* ---------------------------- router ---------------------------- */

function renderNav(active){
  document.body.classList.toggle('not-home', !!active);
  const nav = document.getElementById('nav');
  const items = [
    {href:'#/work', label:'Work', key:'work'},
    {href:'#/about', label:'About', key:'about'},
    {href:'#/contact', label:'Contact', key:'contact'},
  ];
  nav.innerHTML = items.map(i=>`<a href="${i.href}" class="link${active===i.key?' active':''}">${i.label}</a>`).join('');
}

function route(){
  const hash = location.hash.replace(/^#/, '') || '/';
  const parts = hash.split('/').filter(Boolean);

  if(parts.length === 0){ renderNav(''); renderHome(); }
  else if(parts[0] === 'work' && parts.length === 1){ renderNav('work'); renderWork(); }
  else if(parts[0] === 'work' && parts.length === 2){ renderNav('work'); renderProject(parts[1]); }
  else if(parts[0] === 'about'){ renderNav('about'); renderAbout(); }
  else if(parts[0] === 'contact'){ renderNav('contact'); renderContact(); }
  else { renderNav(''); renderHome(); }

  // Scroll to top only after the new page's content has replaced the old -
  // doing it before let the browser's scroll anchoring "helpfully" shift
  // the position again once the DOM swap landed, so a route change from a
  // scrolled-down page could land anywhere but the top. Repeated on the
  // next frame and again after the delayed rasterize pass below: a real
  // device can still reflow after this point (late webfont swap, an image
  // above the fold finishing its own layout) and shift the scroll position
  // on its own even with anchoring off, so one call isn't enough to trust.
  window.scrollTo(0,0);
  requestAnimationFrame(()=>window.scrollTo(0,0));

  rasterizeMobileText();
  // A second pass shortly after: catches layout that's still settling on a
  // real device right after navigation (late webfont swap, images above
  // this text loading in and shifting it) that the immediate pass can miss.
  setTimeout(()=>{ window.scrollTo(0,0); rasterizeMobileText(); }, 350);
}

window.addEventListener('hashchange', route);
window.addEventListener('DOMContentLoaded', route);

/* ---------------------------- discreet image counter ---------------------------- */
let counterObserver;
function setupCounter(total){
  const el = document.getElementById('counter');
  if(counterObserver) counterObserver.disconnect();
  if(!total){ el.textContent = ''; return; }
  const imgs = Array.from(document.querySelectorAll('[data-is-image="1"]'));
  el.textContent = `01 / ${String(total).padStart(2,'0')}`;
  if (isMobileView()) rasterizeOne(el);
  counterObserver = new IntersectionObserver((entries)=>{
    entries.forEach(e=>{
      if(e.isIntersecting){
        const i = imgs.indexOf(e.target) + 1;
        if(i > 0) el.textContent = `${String(i).padStart(2,'0')} / ${String(total).padStart(2,'0')}`;
        if (isMobileView()) rasterizeOne(el);
      }
    });
  }, { threshold: 0.5 });
  imgs.forEach(im=>counterObserver.observe(im));
}

  document.fonts.ready.then(()=>{
    console.info('[fonts] New Berolina MT loaded:', document.fonts.check("16px 'New Berolina MT'"));
    console.info('[fonts] Generic G20-FR Classic loaded:', document.fonts.check("16px 'Generic G20-FR Classic'"));
  });
});
